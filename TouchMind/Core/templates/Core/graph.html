    <meta charset = "UTF-8">
    <title>TouchMind - ネットワーク思考マップ</title>
    <script src = "https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
        body{
            margin: 0;
            overflow: hidden;
            background-color: #f0f4f8;
            font-family: sans-serif;
        }
        #ui-layer{
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.8);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id = "ui-layer">
        <h2 style = "margin:0 0 10px 0;">思考ネットワーク</h2>
        <p style = "margin:0;">🔴 人 &nbsp; 🔵 場所 &nbsp; 🟢 思考</p>
        <!-- <p style = "margin-top:10px; font-size:12px;"><a href = "/" style = "pointer-events: auto;">← 戻る</a></p> -->

        <div style = "margin-top:10px; font-size:12px;">
            <a href = "/" style = "pointer-events: auto; margin-right: 15px;">← 戻る</a>
            <form method = "post" action = "{% url 'logout' %}" style="display: inline; pointer-events: auto;">
                {% csrf_token %}
                <button type = "submit" style="background: none; border: none; color: #0066cc; text-decoration: underline; cursor: pointer; padding: 0;">ログアウト</button>
            </form>
        </div>
    </div>

    <script>
        let nodes = [];
        let links = [];
        let nodeMap = {};
        let energy = 1.0;

        let draggedNode = null;
        // ★追加：画面全体のスクロール（パン）用の変数
        let offsetX = 0;
        let offsetY = 0;
        let isDraggingNetwork = false;
        let dragStartX, dragStartY;

        function preload() {
            fetch('/api/graph-data/')
                .then(response => response.json())
                .then(data => {
                    initGraph(data.nodes, data.links);
                });
        }

        function setup() {
            createCanvas(windowWidth, windowHeight);
            textAlign(CENTER, CENTER);
            textSize(12);
        }

        function initGraph(rawNodes, rawLinks) {
            rawNodes.forEach(n => {
                let node = {
                    id: n.id, label: n.label, group: n.group,
                    x: random(width), y: random(height),
                    vx: 0, vy: 0
                };
                nodes.push(node);
                nodeMap[n.id] = node;
            });

            rawLinks.forEach(l => {
                links.push({
                    source: nodeMap[l.source],
                    target: nodeMap[l.target]
                });
            });
        }

        function draw() {
            background('#f0f4f8');

            if (nodes.length === 0) return;

            // --- 物理シミュレーション (オフセットの影響を受けない絶対座標で計算) ---
            energy *= 0.95;
            if (energy < 0.01) energy = 0;

            let k = 0.05 * energy;
            let repulsion = 3000 * energy;
            let damping = 0.85;

            // 1. 斥力
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    let dx = nodes[i].x - nodes[j].x;
                    let dy = nodes[i].y - nodes[j].y;
                    let distSq = dx * dx + dy * dy;

                    if (distSq < 100) distSq = 100;

                    if (distSq > 0 && distSq < 40000) {
                        let force = repulsion / distSq;
                        let fx = force * dx;
                        let fy = force * dy;
                        nodes[i].vx += fx; nodes[i].vy += fy;
                        nodes[j].vx -= fx; nodes[j].vy -= fy;
                    }
                }
            }

            // 2. 引力
            let restLength = 100;
            for (let l of links) {
                let dx = l.target.x - l.source.x;
                let dy = l.target.y - l.source.y;
                let dist = Math.sqrt(dx * dx + dy * dy) + 0.1;

                let force = (dist - restLength) * k;
                let fx = (dx / dist) * force;
                let fy = (dy / dist) * force;

                l.source.vx += fx; l.source.vy += fy;
                l.target.vx -= fx; l.target.vy -= fy;
            }

            // 3. 中心への引力
            for (let n of nodes) {
                n.vx += (width / 2 - n.x) * 0.001 * energy;
                n.vy += (height / 2 - n.y) * 0.001 * energy;
            }

            // --- ★追加：画面の描画だけをズラす（カメラの移動） ---
            push(); // 現在の描画状態を保存
            translate(offsetX, offsetY); // 画面全体をマウスのドラッグ量に合わせて移動

            stroke(180);
            strokeWeight(1);
            for (let l of links) {
                line(l.source.x, l.source.y, l.target.x, l.target.y);
            }

            noStroke();
            for (let n of nodes) {
                if (n !== draggedNode) {
                    n.x += n.vx; n.y += n.vy;
                    n.vx *= damping; n.vy *= damping;

                    if (Math.abs(n.vx) < 0.05) n.vx = 0;
                    if (Math.abs(n.vy) < 0.05) n.vy = 0;
                }

                if (n.group === 'user') fill(255, 100, 100);
                else if (n.group === 'location') fill(100, 150, 255);
                else fill(100, 200, 100);

                ellipse(n.x, n.y, 30, 30);

                fill(50);
                text(n.label, n.x, n.y + 25);
            }
            pop(); // 描画状態を元に戻す（これがないとUIまでズレてしまう）
        }

        // --- マウスイベント処理 ---

        function mousePressed() {
            // ★変更：マウスの座標からカメラのズレ（オフセット）を引いて、真の座標を計算
            let mx = mouseX - offsetX;
            let my = mouseY - offsetY;
            let nodeClicked = false;

            // ノードをクリックしたか判定
            for (let n of nodes) {
                if (dist(mx, my, n.x, n.y) < 15) {
                    draggedNode = n;
                    energy = 1.0;
                    nodeClicked = true;
                    break;
                }
            }

            // ★追加：ノード以外（背景）をクリックした場合は、全体スクロールを開始
            if (!nodeClicked) {
                isDraggingNetwork = true;
                dragStartX = mouseX - offsetX;
                dragStartY = mouseY - offsetY;
            }
        }

        function mouseDragged() {
            // ノードをドラッグしている場合
            if (draggedNode) {
                draggedNode.x = mouseX - offsetX;
                draggedNode.y = mouseY - offsetY;
                draggedNode.vx = 0;
                draggedNode.vy = 0;
                energy = 1.0;
            }
            // ★追加：背景をドラッグしている場合（カメラの移動）
            else if (isDraggingNetwork) {
                offsetX = mouseX - dragStartX;
                offsetY = mouseY - dragStartY;
            }
        }

        function mouseReleased() {
            draggedNode = null;
            isDraggingNetwork = false; // 全体ドラッグの終了
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
