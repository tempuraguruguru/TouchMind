{% extends 'Core/base.html' %}

{% block title %}TouchMind - 記録画面{% endblock %}

{% load static %}
{% block extra_head %}
    <script src = "https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link rel = "stylesheet" href = "{% static 'Core/style-graph.css' %}">
{% endblock %}

{% block content %}
<div class = "container">
    <div id = "ui-layer">
        <h2 style = "margin:0 0 10px 0;">思考ネットワーク</h2>
        <p style = "margin:0;">🔴 人 &nbsp; 🔵 場所 &nbsp; 🟢 思考</p>
        <!-- <p style = "margin-top:10px; font-size:12px;"><a href = "/" style = "pointer-events: auto;">← 戻る</a></p> -->

        <div style = "margin-top:10px; font-size:12px;">
            <a href = "/" style = "pointer-events: auto; margin-right: 15px;">← 戻る</a>
            <form method = "post" action = "{% url 'logout' %}" style = "display: inline; pointer-events: auto;">
                {% csrf_token %}
                <button type = "submit" style = "background: none; border: none; color: #0066cc; text-decoration: underline; cursor: pointer; padding: 0;">ログアウト</button>
            </form>
        </div>
    </div>
    <script src = "{% static 'Core/script-graph.js' %}"></script>
</div>
{% endblock %}
