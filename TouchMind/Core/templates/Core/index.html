{% extends 'Core/base.html' %}

{% block title %}TouchMind - 記録画面{% endblock %}

{% load static %}
{% block extra_head %}
    <link rel = "stylesheet" href = "{% static 'Core/style.css' %}">
{% endblock %}

{% block content %}
<div class = "container">
    <h2>TouchMind - 思考の記録</h2>
    <p>現在の場所(Tag ID): <strong>{{ tag_id }}</strong></p>

    <input type = "text" id = "thoughtInput" placeholder = "今、何を考えた？">
    <button id = "sendButton">記録する</button>
    <div id = "status"></div>

    <div id = "personalized-card">
        <h3 id = "suggestion-title" style="margin:0 0 8px 0; color:#b58900; font-size:16px;">💡 過去のあなたからのインサイト</h3>
        <p id = "suggestion-message" style="margin:0; font-size:14px; color:#555; line-height:1.6;">コンテキストを解析中...</p>
    </div>

    <script>
        window.CURRENT_TAG_ID = "{{ tag_id }}"
    </script>
    <script src = "{% static 'Core/script.js' %}"></script>
</div>
{% endblock %}
